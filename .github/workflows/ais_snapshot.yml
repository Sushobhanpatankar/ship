name: Fetch AIS Snapshot

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours  (00:00, 02:00, 04:00 … UTC)
  workflow_dispatch:          # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch AIS snapshot (5 min stream)
        run: python fetch_ais_snapshot.py
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AIS_STREAM_SECONDS: "300"

      - name: Commit and push snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ais_snapshot.json
          git diff --cached --quiet || git commit -m "chore: update AIS snapshot [skip ci]"
          git push
